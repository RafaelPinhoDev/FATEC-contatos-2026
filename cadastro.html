<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="./app.js" defer type="module"></script>
    <link rel="stylesheet" href="./style.css">
    <title>Cadastro</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-person-lines-fill"></i> Agenda de Contatos
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="bi bi-search"></i> Consultar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cadastro.html">
                            <i class="bi bi-plus-circle"></i> Cadastrar Novo
                        </a>
                    </li>
                </ul>
            </div>
        </div>
      </nav>
    </header>
    <main class="container mt-5 mb-5">
      <article class="row justify-content-center">
        <div class="col-md-6 border border-primary rounded-3 shadow-sm">
          <form id="form-cadastro" class="p-4">
            <h1 class="text-center fs-3 fw-bold mb-4 text-primary">Cadastrar Contato</h1>
            <input type="hidden" id="id">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo: (Obrigatório)</label>
                <input id="nome" class="form-control" type="text" placeholder="Ex: Pedro Alves da Silva" required>
            </div>
            <div class="mb-3">
                <label for="celular" class="form-label">Celular: (Obrigatório)</label>
                <input id="celular" class="form-control" type="tel" placeholder="Ex 11903752567" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Foto: (Obrigatório) - Toque na moldura parra alterar foto</label>
              
              <div class="d-flex align-items-center gap-4">
          
                <div class="preview-container mb-0">
                    <input id="preview-input" class="preview-input" type="file" accept="image/*">
                    <label class="preview-label" for="preview-input"></label>
                    <img id="preview-image" class="preview-image" src="./img/upload-icon.svg" alt="Preview">
                    <input type="hidden" id="foto" required>
                </div>

                <div class="d-flex flex-column align-items-start">
                  <button type="button" id="limpar-foto" class="btn btn-danger fw-bold px-4 mb-2">Limpar</button>
                </div>
              </div>
          </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail: (Obrigatório)</label>
                <input id="email" class="form-control" type="email" placeholder="Ex: seunome@gmail.com" required >
            </div>
            <div class="mb-3">
                <label for="endereco" class="form-label">Endereço: (Obrigatório)</label>
                <input id="endereco" class="form-control" type="text" placeholder="Ex: Rua das Orquideas, 123" required >
            </div>
            <div class="mb-3">
                <label for="cidade" class="form-label">Cidade: (Obrigatório)</label>
                <input id="cidade" class="form-control" type="text" placeholder="Ex: São Roque" required >
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" id="cadastrar" class="btn btn-success flex-fill">Salvar</button>
                <button type="reset" class="btn btn-warning flex-fill">Limpar Campos</button>
            </div>
          </form>
        </div>
      </article>
    </main>
    <footer class="bg-primary text-white py-3 mt-auto shadow-sm">
      <div class="container text-center">
          <small class="fw-bold">
              &copy; 2026 Rafael Souza de Pinho — Sistemas para Internet
          </small>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
